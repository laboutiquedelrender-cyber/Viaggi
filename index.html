 --input:#202a26;--calc:#232d29;--calc-fg:#dbe5e0;--sec:#1d3a31;--sec-fg:#8fdcc2;--go:#f08a52;--go-fg:#1a0e06;--gosoft:#3a2516;--ok:#8fdcaa;--okbg:#173a26;--bad:#f3a59b;--badbg:#45201c;--warn:#f1d27a;--warnbg:#3a2f12;--info:#9cc0f0;--infobg:#1b2a40;--dA:#1b2320;--dB:#1b2320;--sh:none}}
:root.ui2[data-theme="dark"]{--bg:#121816;--card:#1b2320;--fg:#e6ece9;--muted:#9aaba3;--line:#2c3833;--accent:#5cc2a4;--accent-fg:#0d1512;
 --input:#202a26;--calc:#232d29;--calc-fg:#dbe5e0;--sec:#1d3a31;--sec-fg:#8fdcc2;--go:#f08a52;--go-fg:#1a0e06;--gosoft:#3a2516;--ok:#8fdcaa;--okbg:#173a26;--bad:#f3a59b;--badbg:#45201c;--warn:#f1d27a;--warnbg:#3a2f12;--info:#9cc0f0;--infobg:#1b2a40;--dA:#1b2320;--dB:#1b2320;--sh:none}

/* ---- testi: 5 misure ---- */
:root.ui2 #view h2{font-size:17px;font-weight:650;letter-spacing:-.005em}
:root.ui2 .card>h3,:root.ui2 .cdet>summary h2,:root.ui2 .cdet>summary h3{font-size:17px;font-weight:650;text-transform:none;letter-spacing:0;color:var(--fg)}
:root.ui2 .note{font-size:13px;color:var(--muted)}

/* ---- schede ---- */
:root.ui2 #view .card,:root.ui2 #view details.cdet.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);padding:14px 16px;margin:0 0 12px}
:root.ui2 #view details.cdet:not(.card){border-radius:var(--r)}
:root.ui2 #view details.cdet>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--fg)}
:root.ui2 #view details.cdet>summary::-webkit-details-marker{display:none}
:root.ui2 #view details.cdet>summary::before{display:none}
:root.ui2 #view details.cdet>summary::after{content:'';flex:0 0 auto;margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}

:root.ui2 .btn{min-height:40px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;text-align:center}
:root.ui2 .btn:not(:disabled):hover{border-color:var(--accent)}

:root.ui2 .btn.sm{min-height:34px;padding:0 12px;font-size:13px}

:root.ui2 .ccsh input:not([type=checkbox]):not([type=radio]),:root.ui2 .ccsh select{min-height:42px;padding-left:10px;padding-right:10px;font-size:15px}
:root.ui2 #view input:focus,:root.ui2 #view select:focus,:root.ui2 #view textarea:focus,:root.ui2 .ccsh input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

:root.ui2 .chip{min-height:32px;padding:0 12px;display:inline-flex;align-items:center}
/* ---- tabelle ---- */

:root.ui2 #view .tw{border-radius:var(--r)}
/* ---- testata compatta ---- */
:root.ui2 body:not(.home) .toph h1 .homebtn{font-size:0;gap:0}

:root.ui2 body:not(.home) .toph .uitog{margin-left:auto}

:root.ui2 .c2back{all:unset;cursor:pointer;font-size:26px;line-height:1;color:var(--accent);padding:0 4px 2px}
:root.ui2 .c2t{flex:1;min-width:0;line-height:1.25}

:root.ui2 .c2t small{color:var(--muted)}
:root.ui2 .c2ph{flex:0 0 auto;font-size:13px;font-weight:650;background:var(--sec);color:var(--sec-fg);border-radius:999px;padding:5px 11px;white-space:nowrap}

 const mo=srcSorted('mo');if(!recent.length&&!mo.length)throw new Error('Non ci sono Dati da MO né relazioni recenti: caricali in Importa e backup.');
 const items=[];hotelGroups().forEach(g=>{const d=S.days[g[0]],h=d.hotel;if(!norm(h.name)||blank(h.imp))return;let v=0;g.forEach(j=>v+=hotelCalc(S.days[j]).gr);items.push({id:'h'+d.id,tipo:'Hotel',voce:h.name+' ('+notte(d)+', '+g.length+' notti)',importo:`${fmt(v,0)} ${curName(h.cur)} gruppo`,eur:Math.round(rate(h.cur)?v/rate(h.cur):0)})});
 S.exc.forEach(e=>{const c=excCalc(e);if(!e.prog)return;items.push({id:'e'+e.id,tipo:'Escursione',voce:e.prog+' (giorno '+(dayIdx(e.day)+1)+')',importo:`${fmt(c.gr,0)} ${curName(e.cur)} gruppo`,eur:Math.round(c.eur)})});
 if(!items.length)throw new Error('Non ci sono ancora importi di hotel o escursioni da confrontare.');
 let cap=60000;try{const l=await SAMPLE.limits();if(l&&l.maxPromptBytes)cap=Math.min(l.maxPromptBytes,200000)}catch(e){}
 const PK=/(\d[\d.,]*\s*(€|eur|euro|\$|usd|dollari|cfa|fcfa|cedi|ghs|rupi|npr|nrs|inr)|(€|\$|usd|cfa|fcfa|ghs|npr)\s*\d|prezz|cost|pagat|a persona|gruppo|ingresso|biglietto)/i;
 const head=`Sei l'assistente di un coordinatore di viaggi di gruppo. Confronta i suoi importi previsti con i prezzi di riferimento, per il viaggio ${tripFull()} (${paxLbl()} partecipanti).
Fonti in ordine di priorità: 1) i "Dati da MO" del tour operator: sono schede di altri coordinatori, ciascuna con la sua data ("scheda del gg/mm/aaaa"), già in ordine dalla più recente; 2) solo se nei Dati da MO la voce manca, usa le relazioni, dalla più recente.
REGOLA FONDAMENTALE: per ogni voce usa il prezzo della scheda PIÙ RECENTE che la cita. Se le schede dell'ultimo anno danno prezzi diversi da quelle più vecchie, valgono quelle dell'ultimo anno (i prezzi salgono nel tempo); se più schede recenti danno prezzi diversi, riportali tutti con la data. Se una scheda indica un prezzo per più servizi insieme (es. 2 danze 240.000), dividilo e spiegalo.
Importi previsti (per il gruppo intero):
${items.map(x=>`- [${x.id}] ${x.tipo}: ${x.voce}: ${x.importo} (circa ${x.eur} €)`).join('\n')}

Per ogni voce che trovi nelle fonti indica il prezzo trovato e da dove viene, scrivendo la fonte con la data, es. "(MO 08/08/2026)" oppure "(rel. 2025)" (con e se è a persona o per il gruppo, riportato al gruppo di ${P()} persone se serve) e valuta: "ok" se simile (entro ±15%), "alto" se il previsto è molto più alto, "basso" se è molto più basso, "?" se non confrontabile. Ignora le voci che le fonti non citano. Non inventare prezzi.
Rispondi solo con JSON: [{"id":"il codice tra parentesi quadre della voce, es. e123","voce":"...","previsto":"...","relazioni":"prezzo trovato con fonte e data, es. 120.000 cfa gruppo (MO 08/08/2026)","esito":"ok|alto|basso|?","nota":"breve"}]

Fonti (solo i paragrafi con prezzi):
`;
 const room=Math.max(4000,cap-new TextEncoder().encode(head).length-2000);
 // ai Dati da MO metà dello spazio (o tutto se non ci sono relazioni), il resto alle relazioni recenti
 const moRoom=mo.length?(recent.length?Math.floor(room/2):room):0,relRoom=room-moRoom;
 const cut=(t,max)=>{const b=new TextEncoder().encode(t);return b.length>max?new TextDecoder().decode(b.slice(0,max)).replace(/\uFFFD+$/,'')+'\n[…]':t};

 const moEntries=t=>{const lim=(new Date().getFullYear()-3)*10000,parts=String(t||'').split(/(?=\b\d{2}-\d{2}-\d{4} - )/),out=[];
  parts.forEach(p=>{const m=/^(\d{2})-(\d{2})-(\d{4}) - ([^\n]{0,90})/.exec(p);const k=m?+(m[3]+m[2]+m[1]):0;let body=(m?p.slice(m[0].length):p).replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim();if(!body)return;
   const d=new Date(),rec=(d.getFullYear()-1)*10000+(d.getMonth()+1)*100+d.getDate(),max=k>=rec?15000:k>=lim?5000:1000;if(body.length>max)body=body.slice(0,max)+' […]';

const cmpKind=x=>/^h\d/.test(x.id||'')?'h':/^e\d/.test(x.id||'')?'e':/hotel|lodge|guest|auberge|motel|residence|tata|hostel/i.test(x.voce)?'h':'e';

 const cnt=k=>all.filter(x=>es(x)===k).length,rows=all.filter(x=>F[es(x)]);
 return `<details class="cdet cgrp" id="det-cmp${g}"${OPEN['cmp'+g]!==false?' open':''}><summary><h3>${g==='h'?'Hotel':'Escursioni'} <span class="note">${all.length}</span></h3></summary>
  <div class="cflt"><span class="note">Mostra:</span>${['alto','basso','ok','?'].filter(k=>cnt(k)).map(k=>`<button class="cmpb ${CMPC[k]} tog${F[k]?' on':''}" data-a="cmpf" data-g="${g}" data-k="${k}" type="button" aria-pressed="${F[k]}">${F[k]?'✓ ':''}${CMPL[k]} (${cnt(k)})</button>`).join('')}</div>
  ${rows.length?`<div class="tw"><table class="cmpt"><thead><tr><th>Voce</th><th>Tuo previsto</th><th>Prezzo di riferimento</th><th>Esito</th><th>Nota</th></tr></thead><tbody>${rows.map(x=>`<tr><td style="white-space:normal">${esc(x.voce)}</td><td style="white-space:normal">${esc(x.prev)}</td><td style="white-space:normal">${esc(x.rel)}</td><td>${(()=>{const k=es(x),go=cmpTarget(x.id);return go?`<button class="cmpb ${CMPC[k]}" data-a="cmpopen" data-id="${esc(x.id)}" type="button" title="Apri ${go.k==='e'?'l\'escursione':'l\'hotel'} per modificarlo">${esc(CMPL[k])} ›</button>`:`<span class="cmpb ${CMPC[k]}">${esc(CMPL[k])}</span>`})()}</td><td style="white-space:normal" class="note">${esc(x.nota)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note" style="margin:6px 0">Nessuna voce con i filtri scelti.</p>'}</details>`}

function relSplit(diary,anchors){const txt=String(diary||'');const nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
