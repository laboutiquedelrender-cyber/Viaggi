  const dim=VIEWGRP&&key&&!key.split('+').includes(VIEWGRP),mine=VIEWGRP&&key.split('+').includes(VIEWGRP);

   return `<div class="flrow"><span class="flic" aria-hidden="true">${ico}</span>${a('da','Da','w-m','text','Città')}${a('a','A','w-m','text','Città')}${a('comp','Compagnia','w-m')}${a('nv','N° volo','w-xs','text','TK1362')}${a('dep','Partenza','w-t','time')}${a('arr','Arrivo','w-t','time')}<button class="btn xs del fldel" data-a="delfl" data-d="${d.id}" data-k="${k}" data-v="${v}" type="button" aria-label="Elimina volo">×</button>
    <span class="flbtn">${lastR?`<span class="flplusw">${lastB?`<button class="btn xs flplus" data-a="addgrpfl" data-d="${d.id}" data-k="${k}" type="button" title="Voli di un altro gruppo di partenza">+ gruppo</button>`:''}<button class="btn xs flplus" data-a="addfl" data-d="${d.id}" data-k="${k}" data-gk="${key}" type="button" title="Aggiungi un volo">+ volo</button></span>`:''}</span></div>`}).join('');
  return `<div class="flblock${dim?' dim':''}${mine?' mine':''}"${g?` style="--bc:${g.col}"`:''}>${head}${rows}</div>`}).join('');
 const at=`${d.id}-${k}`;
 return `<div class="ds flights">${FLMSG.at===at?`<div class="msg ${FLMSG.msg[0]}">${esc(FLMSG.msg[1])}</div>`:''}${FLIMP.open&&FLIMP.at===at?flImpHtml():''}${blocks}${x.ds&&!flText(x)?`<span class="note">Descrizione precedente: ${esc(x.ds)}</span>`:''}</div>`}
function defaults(){TRIPS={
 'ghana-togo-benin-2026':{name:'Ghana Togo Benin 2026',updatedAt:0,state:{p:{n:10},start:'2026-10-31',countries:'GH, TG, BJ',

 CUR='ghana-togo-benin-2026'}
function sortedIds(){return Object.keys(TRIPS).sort((a,b)=>String(TRIPS[a].state.start||'').localeCompare(String(TRIPS[b].state.start||''))||TRIPS[a].name.localeCompare(TRIPS[b].name))}
const yrSplit=n=>{const m=/^(.*?)\s+((?:19|20)\d\d(?:\s*[-\/]\s*\d{2,4})?)\s*$/.exec(String(n||''));return m?[m[1],m[2].replace(/\s+/g,'')]:[String(n||''),'']};
const tripFull=(id=CUR)=>{const t=TRIPS[id];if(!t)return '';const y=t.state&&t.state.year;return (t.name||'')+(y?' '+y:'')};

 S.days=S.days&&S.days.length?S.days:blankDays(1);S.exc=S.exc||[];S.cur=S.cur||[];while(S.cur.length<4)S.cur.push({name:'Valuta '+(S.cur.length+1),rate:''});

/* ---------- utilità ---------- */
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};
const fmt=(n,d=2)=>Number(n).toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const curName=i=>i===0?'€':(S.cur[i-1].name||('Valuta '+i));
const rate=i=>i===0?1:(num(S.cur[i-1].rate)||0);
const P=()=>Math.max(1,num(S.p.n));
const paxLbl=()=>P()>1?`${fmt(P()-1,0)}+1`:fmt(P(),0);
const dayIdx=id=>S.days.findIndex(d=>d.id===id);
function dObj(i){if(!S.start)return null;const d=new Date(S.start+'T12:00:00');if(isNaN(d))return null;d.setDate(d.getDate()+i);return d}

function loadScript(src){return libs[src]||(libs[src]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete libs[src];ko(new Error('Libreria non caricata: controlla la connessione e riprova.'))};document.head.appendChild(s)}))}

/* ---------- calcoli ---------- */
const blank=v=>v===''||v==null||String(v).trim()==='';
function hotelCalc(d){const h=d.hotel,r=rate(h.cur);if(!r)return{gr:0,pasti:0,ph:0,tot:0,eur:0};
 const tp=h.tipo||'Gruppo';const base=tp.startsWith('Gruppo')?num(h.imp):num(h.imp)*(tp==='Pax+TLF'?Math.max(0,P()-1):P());
 const stima=((h.c?0:num(S.meals.c))+(h.p?0:num(S.meals.p))+(h.d?0:num(S.meals.d)))*r*P();
 const ph=['c','p','d'].reduce((a,k)=>{if(h[k]!=='hp')return a;const m=(h.mp||{})[k]||{};return a+num(m.imp)*(m.tlf?Math.max(0,P()-1):P())},0);
 const pasti=stima+ph;return{gr:base,pasti,ph,tot:base+pasti,eur:(base+pasti)/r}}
function excCalc(e){const r=rate(e.cur);if(!r)return{gr:0,pax:0,eur:0,paxeur:0};
 const persone=e.tlf?Math.max(0,P()-1):P();const gr=e.tipo==='pax'?num(e.imp)*persone:num(e.imp);

// categorie del viaggio, le stesse per Escursioni e Cassa Comune
const CC_CATS=['Pasto','Hotel','Trasporti','Mance','Corrispondente','Escursioni'];
function tripCats(){if(!Array.isArray(S.cats)){const old=S.cc&&Array.isArray(S.cc.cats)?S.cc.cats:[];S.cats=[...CC_CATS,...old.filter(c=>!CC_CATS.includes(c))]}return S.cats}
function addCat(n){n=String(n||'').trim();if(!n)return '';const L=tripCats(),f=L.find(c=>c.toLowerCase()===n.toLowerCase());if(f)return f;L.push(n);return n}
const excCat=e=>({tras:'Trasporti',manc:'Mance',exc:'Escursioni'})[e.cat]||e.cat||'Escursioni';
let EXF=null;// null = tutte le categorie
const exUsedCats=()=>{const u=new Set(S.exc.map(excCat));return [...tripCats().filter(c=>u.has(c)),...[...u].filter(c=>!tripCats().includes(c))]};

 const rows=S.days.map(()=>({c:[0,0,0,0,0],eur:0}));
 const sum={hotel:[0,0,0,0,0],pasti:[0,0,0,0,0]},sumE={hotel:0,pasti:0};exUsedCats().forEach(c=>{sum['c:'+c]=[0,0,0,0,0];sumE['c:'+c]=0});
 S.days.forEach((d,i)=>{const h=d.hotel,c=hotelCalc(d);if(c.tot){const r=rate(h.cur);rows[i].c[h.cur]+=c.tot;rows[i].eur+=c.eur;sum.hotel[h.cur]+=c.gr;sum.pasti[h.cur]+=c.pasti;sumE.hotel+=c.gr/r;sumE.pasti+=c.pasti/r}});
 S.exc.forEach(e=>{const i=dayIdx(e.day);const c=excCalc(e);if(i<0||!c.gr)return;rows[i].c[e.cur]+=c.gr;rows[i].eur+=c.eur;const k='c:'+excCat(e);sum[k][e.cur]+=c.gr;sumE[k]+=c.eur});

 const used=[0,1,2,3,4].filter(c=>tc[c]);
 return{rows,sum,sumE,tc,te,used}}

function issues(){const out=[];
 if(num(S.p.n)<=0)out.push('Partecipanti non validi');
 if(!S.start)out.push('Data di partenza mancante');
 S.days.forEach((d,i)=>{const n=i+1;
  if(!d.tappe.some(x=>x.trim()))out.push(`Giorno ${n}: nessuna tappa`);
  if(!d.hotel.name.trim())out.push(`Giorno ${n}: hotel mancante`);
  else if(blank(d.hotel.imp))out.push(`Giorno ${n}: importo hotel vuoto (scrivi 0 se la notte è già pagata in un altro giorno)`);
  if(num(d.hotel.imp)&&!rate(d.hotel.cur))out.push(`Giorno ${n}: hotel con cambio mancante`);
  ['c','p','d'].forEach(k=>{if(d.hotel[k]==='hp'&&blank(((d.hotel.mp||{})[k]||{}).imp))out.push(`Giorno ${n}: prezzo ${({c:'della colazione',p:'del pranzo',d:'della cena'})[k]} in hotel vuoto`)});

async function syncIntolNote(D,lang){const src=intolTxt();if((D.intolSrc||'')===src)return false;let note=String(D.note||'');if(D.intolLine)note=note.split('\n').filter(l=>l.trim()!==D.intolLine.trim()).join('\n');

 const h=S.days[idx[0]].hotel,fd=i=>{const d=dObj(i);return d?d.toLocaleDateString(L.loc,{day:'2-digit',month:'2-digit',year:'numeric'}):''},
  out=(()=>{const d=dObj(idx[idx.length-1]);if(!d)return '';const x=new Date(d);x.setDate(x.getDate()+1);return x.toLocaleDateString(L.loc,{day:'2-digit',month:'2-digit',year:'numeric'})})();
 const rows=[],excN=[];
 idx.forEach(i=>{const d=S.days[i],hh=d.hotel,c=hotelCalc(d);
  if(!blank(hh.imp)){const inc=[mealSt(hh.c)==='inc'&&L.bf,mealSt(hh.p)==='inc'&&L.lu,mealSt(hh.d)==='inc'&&L.di].filter(Boolean);
   rows.push({d:fd(i),t:L.night+(inc.length?' – '+inc.join(', '):'')+(hh.tipo==='Pax+TLF'?' ('+L.tlFree+')':''),v:c.gr,cur:hh.cur})}
  ['c','p','d'].forEach(k=>{if(hh[k]!=='hp')return;const m=(hh.mp||{})[k]||{},n=m.tlf?Math.max(0,P()-1):P();rows.push({d:fd(i),t:L.mealFor(L.meal[k],n)+(m.tlf?' ('+L.tlFree+')':''),v:num(m.imp)*n,cur:hh.cur})});
  S.exc.filter(e=>e.hd===d.id).forEach(e=>{const ce=excCalc(e);excN.push(e.prog||L.exc);rows.push({d:fd(dayIdx(e.day)),t:null,v:ce.gr,cur:e.cur,ex:true})})});
 const tr=await trList(excN,lang);let k=0;rows.forEach(r=>{if(r.ex)r.t=tr[k++]});
 const tot={};rows.forEach(r=>{tot[r.cur]=(tot[r.cur]||0)+r.v});const totS=Object.keys(tot).filter(c=>tot[c]).map(c=>`${fmt(tot[c],0)} ${curName(+c)}`).join(' + ')||'0';
 return {lang,title:L.title,hotel:h.name,info:[[L.group,'Mirko Tomassoni'],[L.cin,fd(idx[0])],[L.cout,out],[L.nights,String(idx.length)],[L.pax,L.paxTl(P())]],
  head:[L.date,L.desc,L.amount],rows:rows.map(r=>[r.d,r.t,`${fmt(r.v,0)} ${curName(r.cur)}`]),total:[L.total,totS],note:L.note,at:Date.now()}}

 const rows=[],tx=[],nc=x=>norm(String(x||'').split(/[,(]/)[0]);

function deadlines(){const out=[];hotelGroups().forEach(g=>{const d=S.days[g[0]],h=d.hotel;if(!norm(h.name))return;
  const ci=cancInfo(h);if(ci&&ci.days>=0&&ci.days<=7)out.push({t:`${h.name}: cancellazione gratuita ${ci.days===0?'scade oggi':`entro il ${ci.ds} (tra ${ci.days} g)`}`,id:d.id,cls:ci.days<=2?'bad':'warn'});
  if(h.pag==='Anticipato'&&!h.paid)out.push({t:`${h.name}: da pagare in anticipo`,id:d.id,cls:'warn'})});return out}

`;

function parseItin(rows,warn){const t=header(rows,GG);if(!t){warn.push('Itinerario: non trovo la colonna GG');return null}

function parseDati(rows){const p={cur:[]};

  if(n===s||n.startsWith(s)||s.startsWith(n)||(s.length>=4&&n.includes(s.slice(0,4)))||(fr&&/franc|cfa/.test(n)))return i+1}

async function readFile(f){IMPMSG='';IMPP=null;const name=f.name.toLowerCase();
 try{if(/\.(csv|tsv|txt)$/.test(name)){const txt=await f.text();const k=classify(parseTable(txt));if(!k)throw new Error('Non riconosco la tabella: servono le intestazioni (GG, TAPPE, Hotel o Programma).');IMP[k]=txt}
  else{await loadScript(LIB.xlsx);const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const found=[];IMP.params=null;
   wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});const s=norm(sn);
    let k=s.includes('itinerario')?'itin':s.includes('hotel')?'hotel':s.includes('escursion')?'exc':null;
    if(s==='dati'||s.startsWith('dati')){const d=parseDati(rows);if(d){IMP.params=d;found.push(sn)}return}
    if(!k&&!/riassunto|soldi|costi|regole/.test(s))k=classify(rows);if(k&&!found.includes(k)){IMP[k]=toTSV(rows);found.push(sn)}});
   if(!found.length)throw new Error('Nel file non trovo fogli Itinerario, Hotel, Escursioni o Dati.');IMPMSG=['ok',`Letti i fogli: ${found.join(', ')}. Premi Controlla.`]}
  IMPP=buildImport();if(IMPP&&!IMPMSG)IMPMSG=['ok','File letto.']}
 catch(e){IMPMSG=['bad',e.message||String(e)]}
 render()}
